# Nginx configuration for Instagram Reel Downloader
# Place this file at: /etc/nginx/sites-available/instagram-downloader

# Redirect HTTP to HTTPS (after domain setup)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_HERE;  # Replace with your domain or VPS IP

    # For Cloudflare SSL, keep HTTP open
    # Cloudflare handles HTTPS, Nginx receives HTTP from Cloudflare

    root /var/www/instagram-downloader/backend/static;
    index index.html;

    # Max upload size (for potential future features)
    client_max_body_size 50M;

    # Serve static files (React build)
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (downloads can take time)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for downloads
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
